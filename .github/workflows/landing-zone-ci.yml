name: Landing zone CI

# No path/branch filters: every PR, including schema/scripts/workflow-only changes.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-zone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Landing zone checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TF_INPUT: '0'
      TF_IN_AUTOMATION: '1'
      AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Terraform matching HCP
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Modular YAML matches the versioned Terraform contract
        run: python scripts/build_landing_zone_config.py --check
      - name: Multi-project schema matches the shared model
        run: python scripts/build_project_schema.py
      - name: Git diff, safe files and provider lock preservation
        run: python scripts/check_repository.py --base "$AUDIT_BASE"
      - name: Install pinned secret scanner
        run: python scripts/install_gitleaks.py "$RUNNER_TEMP/landing-zone-tools"
      - name: Secret scan including PR commits
        run: python scripts/run_secret_scan.py --gitleaks "$RUNNER_TEMP/landing-zone-tools/gitleaks" --base "$AUDIT_BASE"
      - name: Schema, Python, state contract, fmt, validate and module tests
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/landing-zone-tools/gitleaks
        run: python scripts/check_landing_zone.py
      - name: Regenerate provider schema from locked binaries and compare
        run: python scripts/export_provider_schema.py --refresh --check
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code
