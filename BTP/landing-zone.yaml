# yaml-language-server: $schema=../schemas/landing-zone.schema.json
# Versioned desired configuration. Credentials remain in HCP/environment variables.
schema_version: 2
account_type: trial
project_name: Project ABC
# These documented aliases are definitions, not availability claims or activations.
# Select via environments.<stage>.services.catalog; the live catalog is mandatory.
service_catalog:
  alert_standard:
    service_name: alert-notification
    plan_name: standard
    profiles: [trial, enterprise]
    instance: {}
  feature_flags_lite:
    service_name: feature-flags
    plan_name: lite
    profiles: [trial, enterprise]
    instance: {}
  feature_flags_dashboard:
    service_name: feature-flags-dashboard
    plan_name: dashboard
    profiles: [trial, enterprise]
    subscription: {app_name: feature-flags-dashboard}
  work_zone_standard:
    service_name: SAPLaunchpad
    plan_name: standard
    profiles: [trial, enterprise]
    subscription: {app_name: SAPLaunchpad}
environments:
  DEV:
    enabled: true
    # null names preserve the original UUID-based derivation and existing addresses.
    name: null
    subdomain: null
    description: null
    region: us10
    iaas_provider: AWS # Validation predicate via btp_regions, not an API argument.
    runtime: cloudfoundry
    parent_id: null
    usage: null
    skip_auto_entitlement: null # Do not turn an omitted creation-only option into false.
    costcenter: "12345"
    beta_enabled: true
    labels: {}
    # Keep the existing HCP administrator assignment and its state key.
    administrators_source: legacy
    administrators: []
    administrator_options: {role_collection_name: Subaccount Administrator, origin: null}
    role_assignments: {}
    cloud_foundry:
      enabled: true
      plan: trial
      name: null
      service_name: cloudfoundry
      environment_type: cloudfoundry
      landscape_label: cf-us10-001 # Existing DEV value confirmed in the saved no-op plan.
      parameters: null
      parameters_key: null
      timeouts: null
      spaces:
        project:
          name: dev-project-abc
          allow_ssh: null
          isolation_segment: null
          labels: null
          annotations: null
          member_origin: null
          roles: {}
          legacy_manager: null
          legacy_developer: null
          # Existing DEV membership remains owned by CloudFoundry/main.tf.
          managers: []
          developers: []
    services:
      alert_notification:
        enabled: true
        plan: standard
        instance: true
      feature_flags:
        enabled: true
        plan: lite
        instance: false
        dashboard: true
      work_zone:
        enabled: false
  TEST:
    enabled: true
    # null names preserve the original UUID-based derivation and existing addresses.
    name: null
    subdomain: null
    description: null
    region: us10
    iaas_provider: AWS # Validation predicate via btp_regions, not an API argument.
    runtime: cloudfoundry
    parent_id: null
    usage: null
    skip_auto_entitlement: null # Do not turn an omitted creation-only option into false.
    costcenter: "12345"
    beta_enabled: true
    labels: {}
    administrators: []
    administrator_options: {role_collection_name: Subaccount Administrator, origin: null}
    role_assignments: {}
    # Preserve the existing pending TEST plan: just a subaccount initially.
    cloud_foundry:
      enabled: false
      plan: trial
      spaces: {}
    services: {}
  PROD:
    # Trial is for personal evaluation, never a production deployment.
    enabled: false
    # null names preserve the original UUID-based derivation and existing addresses.
    name: null
    subdomain: null
    description: null
    region: us10
    iaas_provider: AWS # Validation predicate via btp_regions, not an API argument.
    runtime: cloudfoundry
    parent_id: null
    usage: null
    skip_auto_entitlement: null # Do not turn an omitted creation-only option into false.
    costcenter: "12345"
    beta_enabled: false
    cloud_foundry:
      enabled: false
      plan: standard
      spaces: {}
    services: {}
